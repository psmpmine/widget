<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PSMP Online</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-1: #1b1815;
    --stone-2: #262019;
    --bevel-light: rgba(255,255,255,.14);
    --bevel-dark: rgba(0,0,0,.55);
    --grass-a: #3E8E2F;
    --grass-b: #86D858;
    --gold-a: #C98A1E;
    --gold-b: #F2C94C;
    --red-a: #7A2020;
    --red-b: #C0413A;
    --cream: #F4EFE2;
    --muted: #B7AC96;
  }
  html,body{ margin:0; padding:0; background:transparent; width:fit-content; height:fit-content; }
  *{ box-sizing:border-box; }
  body{
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width: 300px;
    background: linear-gradient(180deg, var(--stone-2), var(--stone-1));
    border-radius: 6px;
    padding: 10px 12px 12px;
    box-shadow:
      inset -2px -2px 0 var(--bevel-dark),
      inset  2px  2px 0 var(--bevel-light),
      0 5px 14px rgba(0,0,0,.4);
  }

  .top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .icon{ width:18px; height:18px; image-rendering:pixelated; flex-shrink:0; display:block; }
  .host{
    font-size:12px; color:var(--muted); letter-spacing:.2px;
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .dot{ width:8px; height:8px; border-radius:2px; flex-shrink:0; background:var(--gold-b); box-shadow:1px 1px 0 rgba(0,0,0,.6); }
  .dot.on{ background:var(--grass-b); }
  .dot.off{ background:var(--red-b); }

  .stage{ position:relative; height:34px; }
  .face{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    border-radius: 4px;
    box-shadow: inset -2px -2px 0 var(--bevel-dark), inset 2px 2px 0 rgba(0,0,0,.25);
    overflow:hidden;
    opacity:0; transition: opacity .5s ease;
    pointer-events:none;
  }
  .face.visible{ opacity:1; pointer-events:auto; }

  /* boss-bar face */
  .bar{ position:absolute; inset:0; background:var(--stone-1); }
  .fill{
    position:absolute; inset:0; width:0%;
    background: linear-gradient(180deg, var(--grass-b), var(--grass-a));
    transition: width .7s ease, background .4s ease;
  }
  .fill::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,0) 40%);
  }
  .bar-text{
    position:relative; z-index:2;
    font-family:'Pixelify Sans', monospace; font-weight:700;
    font-size:16px; color:var(--cream);
    text-shadow: 2px 2px 0 rgba(0,0,0,.65);
    letter-spacing:.5px;
  }

  /* player face */
  .player-face{ background: var(--stone-1); gap:10px; }
  .player-avatar{ width:22px; height:22px; image-rendering:pixelated; flex-shrink:0; }
  .player-name{
    font-family:'Pixelify Sans', monospace; font-weight:700;
    font-size:16px; color:var(--gold-b);
    text-shadow: 2px 2px 0 rgba(0,0,0,.65);
  }
  .player-tag{ font-size:11px; color:var(--muted); margin-left:6px; }

</style>
</head>
<body>

<div class="card">
  <div class="top">
    <svg class="icon" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <rect width="16" height="16" fill="#5D3A22"/>
      <rect width="16" height="6" fill="#6AAF3D"/>
      <rect width="16" height="2" fill="#7FC24A"/>
      <rect x="1" y="6" width="2" height="2" fill="#4C7E2B"/>
      <rect x="6" y="6" width="2" height="1" fill="#4C7E2B"/>
      <rect x="11" y="6" width="2" height="2" fill="#4C7E2B"/>
      <rect y="9" width="16" height="7" fill="#4A2F1C"/>
    </svg>
    <span class="host">psmp.minerent.io</span>
    <span class="dot" id="dot"></span>
  </div>

  <div class="stage">
    <div class="face visible" id="faceCount">
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>
      <div class="bar-text" id="barText">— / —</div>
    </div>

    <div class="face player-face" id="facePlayer" style="display:flex;">
      <svg class="player-avatar" viewBox="0 0 8 8" shape-rendering="crispEdges">
        <rect width="8" height="8" fill="#D8AE7E"/>
        <rect x="1" y="1" width="2" height="2" fill="#4A2F1C"/>
        <rect x="5" y="1" width="2" height="2" fill="#4A2F1C"/>
        <rect x="2" width="4" height="1" fill="#5C3A1E"/>
      </svg>
      <span class="player-name" id="playerName">—</span>
      <span class="player-tag">в сети</span>
    </div>
  </div>
</div>

<script>
  const HOST = "psmp.minerent.io";
  const LOCAL_PROXY = "http://localhost:3001/"; // см. psmp-live-proxy/server.js
  const POLL_MS = 3500;   // при работающем локальном прокси — реальная задержка ~3-4 сек
  const ROTATE_MS = 8000;

  const dotEl = document.getElementById("dot");
  const fillEl = document.getElementById("fill");
  const barTextEl = document.getElementById("barText");
  const faceCount = document.getElementById("faceCount");
  const facePlayer = document.getElementById("facePlayer");
  const playerNameEl = document.getElementById("playerName");

  let latest = null;       // last server data
  let showingPlayer = false;

  async function fetchStatus(){
    // 1) сначала пробуем локальный прокси — он опрашивает сервер напрямую, без чужого кэша
    try{
      const res = await fetch(LOCAL_PROXY, { cache: "no-store" });
      if(res.ok) return await res.json();
    } catch(e){ /* прокси не запущен — идём дальше */ }

    // 2) запасной вариант — публичный API (данные могут быть с задержкой из-за его кэша)
    const res = await fetch(`https://api.mcsrvstat.us/3/${HOST}`, { cache: "no-store" });
    return await res.json();
  }

  async function poll(){
    try{
      const data = await fetchStatus();
      latest = data;

      if(data && data.online){
        const online = (data.players && data.players.online) || 0;
        const max = (data.players && data.players.max) || 0;
        const pct = max > 0 ? Math.min(100, (online / max) * 100) : 0;

        fillEl.style.width = pct + "%";
        fillEl.style.background = pct >= 90
          ? "linear-gradient(180deg, var(--gold-b), var(--gold-a))"
          : "linear-gradient(180deg, var(--grass-b), var(--grass-a))";
        barTextEl.textContent = max ? `${online} / ${max}` : `${online}`;
        dotEl.className = "dot on";
      } else {
        fillEl.style.width = "100%";
        fillEl.style.background = "linear-gradient(180deg, var(--red-b), var(--red-a))";
        barTextEl.textContent = "офлайн";
        dotEl.className = "dot off";
      }
    } catch(e){
      barTextEl.textContent = "нет данных";
      dotEl.className = "dot off";
    }
  }

  function rotate(){
    const list = (latest && latest.online && latest.players && latest.players.list) || [];

    if(!showingPlayer && list.length > 0){
      const pick = list[Math.floor(Math.random() * list.length)];
      const name = typeof pick === "string" ? pick : (pick.name || "???");
      playerNameEl.textContent = name;

      faceCount.classList.remove("visible");
      facePlayer.classList.add("visible");
      showingPlayer = true;
    } else {
      facePlayer.classList.remove("visible");
      faceCount.classList.add("visible");
      showingPlayer = false;
    }
  }

  poll();
  setInterval(poll, POLL_MS);
  setInterval(rotate, ROTATE_MS);
</script>

</body>
</html>
